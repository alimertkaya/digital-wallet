spring.application.name=digital-wallet
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.r2dbc.properties.schema-generation.database.action=none
spring.sql.init.mode=always
spring.sql.init.platform=postgres

# Kafka topic konfigürasyonu (prod'da 6 partition, 3 replica önerilir)
app.kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:1}
app.kafka.topic.replicas=${KAFKA_TOPIC_REPLICAS:1}

# Kafka — serializer/deserializer tüm profillerde aynı
spring.kafka.consumer.group-id=${app.kafka.group-id:digital-wallet-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}

# Exchange rate API
app.exchange-rate-api.url=https://api.frankfurter.app/latest?from=USD

# Scheduling
spring.task.scheduling.pool.size=2

# Outbox polling interval (ms)
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}

# CORS (dev default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Rate limiting (auth endpoint'leri için IP başına istek/dakika)
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:10}

# Wallet işlem limitleri
app.wallet.daily-transaction-limit=${DAILY_TRANSACTION_LIMIT:10000}

# Auth — başarısız giriş kilitleme + token TTL'leri
app.auth.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.auth.refresh-token-expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:7}

# Encryption key (256-bit / 32 byte, Base64 encoded)
app.encryption.key=${ENCRYPTION_KEY}

# Circuit breaker — Frankfurter API
resilience4j.circuitbreaker.instances.exchangeRateApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.exchangeRateApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.exchangeRateApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.exchangeRateApi.permitted-calls-in-half-open-state=3

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Distributed tracing (Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
